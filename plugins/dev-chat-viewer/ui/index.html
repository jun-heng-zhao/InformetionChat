<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>归档查看器</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <h1>聊天归档查看器</h1>
  <p>本插件不实现格式转换，而是消费 <code>document.convert</code> 服务；
     用户绑定的提供者决定实际由哪个插件完成转换。</p>

  <label for="format">导出格式</label>
  <select id="format">
    <option value="markdown">Markdown</option>
  </select>

  <button id="pick">选择归档并导出</button>
  <button id="save" disabled>保存结果</button>

  <label for="preview">预览</label>
  <textarea id="preview" readonly></textarea>
  <div id="status" role="status"></div>

  <script src="assets/bridge.js"></script>
  <script src="assets/page.js"></script>
</body>
</html>

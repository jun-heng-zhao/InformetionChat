<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本地测试提醒</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <h1>本地测试提醒</h1>
  <p>本插件只提交通知请求，是否弹出、以什么等级展示由宿主按用户授权决定。
     来源标识由宿主安装记录生成，插件无法冒充其他来源。</p>

  <label for="category">通知类别</label>
  <select id="category">
    <option value="local-test-alert">local-test-alert（已申请 critical）</option>
    <option value="local-test-info">local-test-info（上限 normal）</option>
  </select>

  <label for="level">请求等级</label>
  <select id="level">
    <option value="critical">critical 紧急</option>
    <option value="important">important 重要</option>
    <option value="normal">normal 普通</option>
  </select>

  <button id="publish">发布测试事件</button>
  <button id="withdraw" disabled>撤回上次事件</button>
  <div id="status" role="status"></div>

  <script src="assets/bridge.js"></script>
  <script src="assets/page.js"></script>
</body>
</html>
